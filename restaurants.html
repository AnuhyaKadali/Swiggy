<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <link rel="stylesheet" href="header.css">
    <link rel="stylesheet" href="restaurants.css">
    <link rel="stylesheet" href="footer.css">
    <link rel="shortcut icon" href="Icons.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <h1>Top Restaurants Near You</h1>
    </header>
    <main>
        <p>Hungry? Discover delicious food from the best restaurants in your area. From street food to fine dining, Swiggy brings a wide variety of cuisines right to your doorstep.</p>
    <br>
        <h2>Popular Cuisines</h2>
    
        <div class="tabs">
            <input type="radio" id="northindian" name="cuisine" checked>
            <label for="northindian">North Indian</label>
    
            <input type="radio" id="southindian" name="cuisine">
            <label for="southindian">South Indian</label>
    
            <input type="radio" id="chinese" name="cuisine">
            <label for="chinese">Chinese</label>
    
            <input type="radio" id="italian" name="cuisine">
            <label for="italian">Italian</label>
    
            <input type="radio" id="fastfood" name="cuisine">
            <label for="fastfood">Fast Food</label>
    
            <input type="radio" id="desserts" name="cuisine">
            <label for="desserts">Desserts</label>
    
            <!-- Cuisine Images -->
            <div class="content" id="content-northindian">
                <img src="north1.jpg" alt="North Indian Dish">
                <img src="north2.jpg" alt="North Indian Dish">
                <img src="north3.jpg" alt="North Indian Dish">
                <img src="north4.jpg" alt="North Indian Dish">
            </div>
            <div class="content" id="content-southindian">
                <img src="south1.jpg" alt="South Indian Dish">
                <img src="south2.jpg" alt="South Indian Dish">
                <img src="south3.jpg" alt="South Indian Dish">
                <img src="south4.jpg" alt="South Indian Dish">
            </div>
            <div class="content" id="content-chinese">
                <img src="chinese1.jpg" alt="Chinese Dish">
                <img src="chinese2.jpg" alt="Chinese Dish">
                <img src="chinese3.jpg" alt="Chinese Dish">
                <img src="chinese4.jpg" alt="Chinese Dish">
            </div>
            <div class="content" id="content-italian">
                <img src="italian1.jpg" alt="Italian Dish">
                <img src="italian2.jpg" alt="Italian Dish">
                <img src="italian3.jpg" alt="Italian Dish">
                <img src="italian4.jpg" alt="Italian Dish">
            </div>
            <div class="content" id="content-fastfood">
                <img src="fast1.jpg" alt="Fast Food">
                <img src="fast2.jpg" alt="Fast Food">
                <img src="fast3.jpg" alt="Fast Food">
                <img src="fast4.jpg" alt="Fast Food">
            </div>
            <div class="content" id="content-desserts">
                <img src="dessert1.jpg" alt="Dessert">
                <img src="dessert2.jpg" alt="Dessert">
                <img src="dessert3.jpg" alt="Dessert">
                <img src="dessert4.jpg" alt="Dessert">
            </div>
        </div>
    <br>
        <p>Order now and enjoy fast delivery, live order tracking, and exciting offers!</p>
    </main>
    
</body>
</html>
